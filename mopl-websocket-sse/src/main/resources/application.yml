server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: mopl-websocket-sse
  profiles:
    active: ${PROFILE}

jwt:
  max-active: 1
  access-token:
    secret: ${JWT_ACCESS_TOKEN_KEY}
    expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRCATION_MS}
  refresh-token:
    secret: ${JWT_REFRESH_TOKEN_KEY}
    expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRCATION_MS}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

  endpoint:
    health:
      show-details: always

  health:
    redis:
      enabled: false
