spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/app
    driver-class-name: org.postgresql.Driver
    username: app
    password: app1234

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: redis
      port: 6379


logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    com.mopl: DEBUG