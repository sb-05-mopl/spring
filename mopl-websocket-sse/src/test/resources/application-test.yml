spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    driver-class-name: org.postgresql.Driver
    username: app
    password: app1234

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: INFO
    com.mopl: DEBUG
jwt:
  max-active: 1
  access-token:
    secret: test-access-token-secret-key-must-be-long-enough-for-hmac
    expiration-ms: 3600000
  refresh-token:
    secret: test-refresh-token-secret-key-must-be-long-enough-for-hmac
    expiration-ms: 86400000