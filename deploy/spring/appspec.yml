version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/spring
    overwrite: yes
permissions:
  - object: /
    owner: ubuntu
    group: ubuntu
hooks:
  BeforeInstall:
    - location: scripts/before-install.sh
      timeout: 60
      runas: ubuntu
  ApplicationStart:
    - location: scripts/starts.sh
      timeout: 300
      runas: ubuntu
