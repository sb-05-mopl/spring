version: '3.8'

services:
  spring-websocket:
    image: 989775483620.dkr.ecr.ap-northeast-2.amazonaws.com/mopl/websocket:latest
    container_name: spring-websocket
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PROFILE=prod

      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      - SPRING_ELASTIC_SERVERS=${SPRING_ELASTIC_SERVERS}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
      - MOPL_KAFKA_TOPICS_NOTIFICATIONS=${MOPL_KAFKA_TOPICS_NOTIFICATIONS}
