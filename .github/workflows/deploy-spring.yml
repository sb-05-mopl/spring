name: Deploy Spring-Core To EC2
on:
  push:
    branches:
      - deploy
    paths:
      - "mopl-core/**"
      - ".github/workflows/deploy-spring.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Repository 가져오기
        uses: actions/checkout@v4

      - name:  JDK 21 버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 빌드
        run: ./gradlew :mopl-core:clean :mopl-core:build

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Spring Docker 이미지 생성
        run: docker build -t mopl-spring -f mopl-core/Dockerfile-prod .

      - name: Spring Docker 이미지에 Tag 붙이기.
        run: docker tag mopl-spring ${{steps.login-ecr.outputs.registry}}/mopl/spring:latest

      - name: ECR에 Spring Docker 이미지 Push
        run: docker push ${{steps.login-ecr.outputs.registry}}/mopl/spring:latest

      - name: .env 파일 생성
        run: |
          cat > .env << EOF
          PROFILE=${{secrets.PROFILE}}
          
          JWT_ACCESS_TOKEN_EXPIRCATION_MS=${{secrets.JWT_ACCESS_TOKEN_EXPIRCATION_MS}}
          JWT_REFRESH_TOKEN_EXPIRCATION_MS=${{secrets.JWT_REFRESH_TOKEN_EXPIRCATION_MS}}
          JWT_ACCESS_TOKEN_KEY=${{secrets.JWT_ACCESS_TOKEN_KEY}}
          JWT_REFRESH_TOKEN_KEY=${{secrets.JWT_REFRESH_TOKEN_KEY}}
          
          INIT_ADMIN_EMAIL=${{secrets.INIT_ADMIN_EMAIL}}
          INIT_ADMIN_PASSWORD=${{secrets.INIT_ADMIN_PASSWORD}}
          INIT_USER_EMAIL=${{secrets.INIT_USER_EMAIL}}
          INIT_USER_PASSWORD=${{secrets.INIT_USER_PASSWORD}}
          
          SMTP_PORT=${{secrets.SMTP_PORT}}
          SMTP_USERNAME=${{secrets.SMTP_USERNAME}}
          SMTP_PASSWORD=${{secrets.SMTP_PASSWORD}}
          SMTP_HOST=${{secrets.SMTP_HOST}}
          
          AWS_ACCESS_KEY=${{secrets.AWS_ACCESS_KEY}}
          AWS_SECRET_KEY=${{secrets.AWS_SECRET_KEY}}
          AWS_BUCKET_NAME=${{secrets.AWS_BUCKET_NAME}}
          
          GOOGLE_CLIENT_ID=${{secrets.GOOGLE_CLIENT_ID}}
          GOOGLE_CLIENT_SECRET=${{secrets.GOOGLE_CLIENT_SECRET}}
          
          KAKAO_CLIENT_ID=${{secrets.KAKAO_CLIENT_ID}}
          KAKAO_CLIENT_SECRET=${{secrets.KAKAO_CLIENT_SECRET}}
          
          DB_URL=${{secrets.DB_URL}}
          DB_USERNAME=${{secrets.DB_USERNAME}}
          DB_PASSWORD=${{secrets.DB_PASSWORD}}
          
          SPRING_ELASTIC_SERVERS=${{secrets.SPRING_ELASTIC_SERVERS}}
          SPRING_KAFKA_BOOTSTRAP_SERVERS=${{secrets.SPRING_KAFKA_BOOTSTRAP_SERVERS}}
          MOPL_KAFKA_TOPICS_NOTIFICATIONS=${{secrets.MOPL_KAFKA_TOPICS_NOTIFICATIONS}}
          
          REDIS_HOST=${{secrets.REDIS_HOST}}
          REDIS_PORT=${{secrets.REDIS_PORT}}
          EOF

      - name: 압축하기
        run: tar -czvf $GITHUB_SHA.tar.gz .env deploy/spring/appspec.yml deploy/spring/scripts deploy/spring/docker-compose.prod.yml

      - name: S3에 프로젝트 폴더 업로드 하기
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.tar.gz s3://mopl-deploy-4/spring/$GITHUB_SHA.tar.gz

      - name: CodeDeploy 배포 트리거
        run: |
          aws deploy create-deployment \
            --application-name mopl-spring \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name mopl-deploy-group \
            --s3-location bucket=mopl-deploy-4,key=spring/$GITHUB_SHA.tar.gz,bundleType=tgz
