name: Deploy Spring-Websocket To EC2
on:
  push:
    branches:
      - main
    paths:
      - "mopl-websocket-sse/**"
      - ".github/workflows/deploy-websocket.yml"
      - "deploy/websocket/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Repository 가져오기
        uses: actions/checkout@v4

      - name:  JDK 21 버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드
        run: ./gradlew :mopl-websocket-sse:clean :mopl-websocket-sse:build
      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Spring Docker 이미지 생성
        run: docker build -t mopl-websocket -f mopl-websocket-sse/Dockerfile-prod .

      - name: Spring Docker 이미지에 Tag 붙이기.
        run: docker tag mopl-websocket ${{steps.login-ecr.outputs.registry}}/mopl/websocket:latest

      - name: ECR에 Spring Docker 이미지 Push
        run: docker push ${{steps.login-ecr.outputs.registry}}/mopl/websocket:latest

      - name: .env 파일 생성
        run: |
          cat > .env << EOF
          PROFILE=${{secrets.PROFILE}}
          
          DB_URL=${{secrets.DB_URL}}
          DB_USERNAME=${{secrets.DB_USERNAME}}
          DB_PASSWORD=${{secrets.DB_PASSWORD}}
          
          SPRING_ELASTIC_SERVERS=${{secrets.SPRING_ELASTIC_SERVERS}}
          SPRING_KAFKA_BOOTSTRAP_SERVERS=${{secrets.SPRING_KAFKA_BOOTSTRAP_SERVERS}}
          MOPL_KAFKA_TOPICS_NOTIFICATIONS=${{secrets.MOPL_KAFKA_TOPICS_NOTIFICATIONS}}
          REDIS_HOST=${{secrets.REDIS_HOST}}
          REDIS_PORT=${{secrets.REDIS_PORT}}
          
          JWT_ACCESS_TOKEN_EXPIRCATION_MS=${{secrets.JWT_ACCESS_TOKEN_EXPIRCATION_MS}}
          JWT_REFRESH_TOKEN_EXPIRCATION_MS=${{secrets.JWT_REFRESH_TOKEN_EXPIRCATION_MS}}
          JWT_ACCESS_TOKEN_KEY=${{secrets.JWT_ACCESS_TOKEN_KEY}}
          JWT_REFRESH_TOKEN_KEY=${{secrets.JWT_REFRESH_TOKEN_KEY}}
          
          EOF

      - name: 압축하기
        run: |
          cp deploy/websocket/appspec.yml ./appspec.yml
          cp -r deploy/websocket/scripts ./scripts
          cp deploy/websocket/docker-compose.prod.yml ./docker-compose.prod.yml
          tar -czvf $GITHUB_SHA.tar.gz \
            appspec.yml \
            .env \
            scripts \
            docker-compose.prod.yml
      - name: S3에 프로젝트 폴더 업로드 하기
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.tar.gz s3://mopl-deploy-4/websocket/$GITHUB_SHA.tar.gz

      - name: CodeDeploy 배포 트리거
        run: |
          aws deploy create-deployment \
            --application-name mopl-spring-websocket \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name mopl-deploy-group-websocket \
            --s3-location bucket=mopl-deploy-4,key=websocket/$GITHUB_SHA.tar.gz,bundleType=tgz
