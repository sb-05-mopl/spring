events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream spring-api { server spring-api:8080; }
  upstream websocket-server { server websocket-server:8080; }

  server {
    listen 80 default_server;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/sse {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
    location ^~ /api/notifications { proxy_pass http://websocket-server; }
    location ^~ /api/conversations { proxy_pass http://websocket-server; }
    location ^~ /api/direct-messages { proxy_pass http://websocket-server; }

    location ^~ /api/watching-sessions/sse {
      proxy_pass http://websocket-server;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
    }

    location ^~ /api/ {
      proxy_pass http://spring-api;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
