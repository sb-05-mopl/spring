worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
    }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream spring-api {
    server spring-api:8080;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
  }
  upstream websocket-server {
    server websocket-server:8080;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
  }

  server {
    listen 80 default_server;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /ws {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location ^~ /api/sse {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    location ^~ /api/notifications {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; }
    location ^~ /api/conversations {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; }
    location ^~ /api/direct-messages {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; }

    location ^~ /api/watching-sessions/sse {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    location ~ ^/api/contents/[^/]+/watching-sessions {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~ ^/api/users/[^/]+/watching-sessions {
        proxy_pass http://websocket-server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /oauth2 {
        proxy_pass http://spring-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        proxy_pass http://spring-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://spring-api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /actuator/core/ {
        proxy_pass http://spring-api/actuator/;
    }

    location /actuator/ws/ {
        proxy_pass http://websocket-server/actuator/;
    }
  }
}